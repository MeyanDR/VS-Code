<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test App Loading</title>
</head>
<body>
    <h1>Testing App Loading</h1>
    <p>Open browser console to see errors</p>
    
    <script>
        console.log("Test page loaded");
        
        // Try to fetch the app
        fetch('http://localhost:3003/')
            .then(response => response.text())
            .then(html => {
                console.log("App HTML received, length:", html.length);
                
                // Check if it contains expected elements
                if (html.includes('id="app"')) {
                    console.log("✓ Found app div");
                } else {
                    console.error("✗ App div not found");
                }
                
                if (html.includes('src="/src/index.jsx"')) {
                    console.log("✓ Found index.jsx script");
                } else {
                    console.error("✗ index.jsx script not found");
                }
            })
            .catch(err => console.error("Failed to fetch app:", err));
            
        // Try to fetch main JS file
        fetch('http://localhost:3003/src/index.jsx')
            .then(response => response.text())
            .then(js => {
                console.log("index.jsx loaded, length:", js.length);
                if (js.includes('ErrorBoundary')) {
                    console.log("✓ ErrorBoundary found in index.jsx");
                }
                if (js.includes('ReactDOM.createRoot')) {
                    console.log("✓ ReactDOM.createRoot found");
                }
            })
            .catch(err => console.error("Failed to fetch index.jsx:", err));
    </script>
    
    <iframe src="http://localhost:3003/" width="100%" height="600" style="border: 2px solid red;"></iframe>
</body>
</html>
