<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TROMKLUB Machine - Refactored Version</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>TROMKLUB Machine</h1>
        <p>Professional Drum Notation System</p>
    </div>

    <!-- Main Controls -->
    <div class="controls">
        <div class="control-group">
            <label>BPM:</label>
            <input type="number" id="bpmInput" value="120" min="60" max="200">
        </div>
        <div class="control-group">
            <label>Subdivision:</label>
            <select id="subdivisionSelect">
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="6">6</option>
                <option value="8">8</option>
            </select>
        </div>
        <button id="playBtn" class="btn">▶ Play</button>
        <button id="stopBtn" class="btn">⏹ Stop</button>
        <button id="clearBtn" class="btn btn-clear">Clear All</button>
        <button id="undoBtn" class="btn btn-undo">↶ Undo</button>
        <button id="redoBtn" class="btn btn-redo">↷ Redo</button>
    </div>

    <!-- File Operations -->
    <div class="function-bar">
        <h3>File Operations</h3>
        <button id="saveBtn" class="btn btn-save">💾 Save</button>
        <button id="loadBtn" class="btn">📂 Load</button>
        <button id="exportBtn" class="btn btn-export">📄 Export</button>
    </div>

    <!-- Main Sequencer Container -->
    <div class="sequencer-container">
        <!-- Symbol Controls Panel -->
        <div class="symbol-controls">
            <!-- Notes Section -->
            <div class="notes-section">
                <h4>Section Notes</h4>
                <textarea class="section-notes-input" placeholder="Add notes for this section..."></textarea>
            </div>

            <!-- Symbol Selection -->
            <div class="symbol-section">
                <h4>Symbols</h4>
                <div class="symbol-row">
                    <div class="note-symbol active">X</div>
                    <div class="note-symbol">O</div>
                    <div class="note-symbol">●</div>
                    <div class="note-symbol">○</div>
                    <div class="note-symbol">+</div>
                    <div class="note-symbol">◆</div>
                    <div class="note-symbol">▲</div>
                    <div class="note-symbol">▼</div>
                </div>
            </div>

            <!-- Modifier Selection -->
            <div class="modifier-section">
                <h4>Modifiers</h4>
                <div class="modifier-row">
                    <div class="note-modifier">g</div>
                    <div class="note-modifier">d</div>
                    <div class="note-modifier">f</div>
                    <div class="note-modifier">r</div>
                    <div class="note-modifier">l</div>
                </div>
            </div>

            <!-- Preview -->
            <div class="preview-section">
                <h4>Current Selection</h4>
                <div class="symbol-preview">X</div>
            </div>

            <!-- Selection Controls -->
            <div class="selection-controls">
                <h4>Selection</h4>
                <button class="btn btn-copy">Copy</button>
                <button class="btn btn-cut">Cut</button>
                <button class="btn btn-paste">Paste</button>
            </div>
        </div>

        <!-- Instrument Section -->
        <div class="instrument-section">
            <div class="current-section-info">
                <h3>Section: Intro</h3>
                <p>4 bars • 4/4 time</p>
            </div>

            <!-- Bar Container -->
            <div class="bar-section">
                <div class="bar-section-header">Bar 1</div>
                
                <!-- Instrument Rows -->
                <div class="instrument-row">
                    <button class="visibility-toggle">👁</button>
                    <div class="instrument-label">Kick</div>
                    <div class="beat-indicator">1</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="1-1-1"></div>
                        <div class="step" data-step-id="1-1-2"></div>
                        <div class="step" data-step-id="1-1-3"></div>
                        <div class="step" data-step-id="1-1-4"></div>
                    </div>
                    <div class="beat-indicator">2</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="1-2-1"></div>
                        <div class="step" data-step-id="1-2-2"></div>
                        <div class="step" data-step-id="1-2-3"></div>
                        <div class="step" data-step-id="1-2-4"></div>
                    </div>
                    <div class="beat-indicator">3</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="1-3-1"></div>
                        <div class="step" data-step-id="1-3-2"></div>
                        <div class="step" data-step-id="1-3-3"></div>
                        <div class="step" data-step-id="1-3-4"></div>
                    </div>
                    <div class="beat-indicator">4</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="1-4-1"></div>
                        <div class="step" data-step-id="1-4-2"></div>
                        <div class="step" data-step-id="1-4-3"></div>
                        <div class="step" data-step-id="1-4-4"></div>
                    </div>
                </div>

                <div class="instrument-row">
                    <button class="visibility-toggle">👁</button>
                    <div class="instrument-label">Snare</div>
                    <div class="beat-indicator">1</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="2-1-1"></div>
                        <div class="step" data-step-id="2-1-2"></div>
                        <div class="step" data-step-id="2-1-3"></div>
                        <div class="step" data-step-id="2-1-4"></div>
                    </div>
                    <div class="beat-indicator">2</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="2-2-1"></div>
                        <div class="step" data-step-id="2-2-2"></div>
                        <div class="step" data-step-id="2-2-3"></div>
                        <div class="step" data-step-id="2-2-4"></div>
                    </div>
                    <div class="beat-indicator">3</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="2-3-1"></div>
                        <div class="step" data-step-id="2-3-2"></div>
                        <div class="step" data-step-id="2-3-3"></div>
                        <div class="step" data-step-id="2-3-4"></div>
                    </div>
                    <div class="beat-indicator">4</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="2-4-1"></div>
                        <div class="step" data-step-id="2-4-2"></div>
                        <div class="step" data-step-id="2-4-3"></div>
                        <div class="step" data-step-id="2-4-4"></div>
                    </div>
                </div>

                <div class="instrument-row">
                    <button class="visibility-toggle">👁</button>
                    <div class="instrument-label">Hi-Hat</div>
                    <div class="beat-indicator">1</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="3-1-1"></div>
                        <div class="step" data-step-id="3-1-2"></div>
                        <div class="step" data-step-id="3-1-3"></div>
                        <div class="step" data-step-id="3-1-4"></div>
                    </div>
                    <div class="beat-indicator">2</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="3-2-1"></div>
                        <div class="step" data-step-id="3-2-2"></div>
                        <div class="step" data-step-id="3-2-3"></div>
                        <div class="step" data-step-id="3-2-4"></div>
                    </div>
                    <div class="beat-indicator">3</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="3-3-1"></div>
                        <div class="step" data-step-id="3-3-2"></div>
                        <div class="step" data-step-id="3-3-3"></div>
                        <div class="step" data-step-id="3-3-4"></div>
                    </div>
                    <div class="beat-indicator">4</div>
                    <div class="beat-steps">
                        <div class="step beat-start" data-step-id="3-4-1"></div>
                        <div class="step" data-step-id="3-4-2"></div>
                        <div class="step" data-step-id="3-4-3"></div>
                        <div class="step" data-step-id="3-4-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Export Modal (simplified) -->
    <div id="exportModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Export Options</h3>
            </div>
            <div class="form-group">
                <label>Format:</label>
                <select id="exportFormat">
                    <option value="pdf">PDF</option>
                    <option value="png">PNG</option>
                    <option value="json">JSON</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="btn" onclick="this.closest('.modal').style.display='none'">Cancel</button>
                <button class="btn btn-export">Export</button>
            </div>
        </div>
    </div>

    <!-- Load JavaScript Modules -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
